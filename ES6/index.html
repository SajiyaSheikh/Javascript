<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #151313;
        }

        /* Header */
        h1 {
            text-align: center;
            color: white;
        }

        /* Search bar */
        input {
            width: 40%;
            padding: 10px;
            margin-left: 30%;
            margin-right: 10px;
            /* display: block; */
            border: 1px solid #ccc;
            border-radius: 20px;
        }

        button {
            /* display: block; */
            /* margin: 20px; */
            padding: 8px 20px;
            border: none;
            background-color: red;
            color: white;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkred;
        }

        /* Video Grid */
        #video_container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        /* Video Card */
        #video_container>div {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            /* transition: transform 0.2s; */
        }

        #video_container>div:hover {
            transform: scale(1.03);
        }

        /* Video */
        iframe {
            width: 100%;
            height: 200px;
            border: none;
        }

        /* Title */
        p {
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <h1>You Tube</h1>
    <input type="text" id="query" placeholder="Seach Here...">
    <button onclick="searchVideos()">Search</button>
    <div id="video_container"></div>
</body>

</html>
<script>
    //https://developers.google.com/youtube/v3
    //GET https://youtube.googleapis.com/youtube/v3/search?part=snippet&maxResults=30&q=kgf%202&key=AIzaSyBAJIM22cESRjwJ3FwpsQ1IaopjUFqLNPo

    const searchVideos = async () => {
        try {
            const query = document.querySelector("#query").value;
            const res = await fetch(`https://youtube.googleapis.com/youtube/v3/search?part=snippet&maxResults=30&q=${query}%202&key=AIzaSyBAJIM22cESRjwJ3FwpsQ1IaopjUFqLNPo`);
            const data = await res.json();
            append(data.items);
        }
        catch (err) {
            console.log("err:", err);
        }
    };

    const append = (videos) => {
        let video_container = document.querySelector("#video_container");
        video_container.innerHTML = null;
        videos.forEach(({ id: { videoId }, snippet: { title } }) => {
            let div = document.createElement("div");
            let iframe = document.createElement("iframe");
            let video_title = document.createElement("p");

            iframe.src = `https://www.youtube.com/embed/${videoId}`;
            iframe.width = "100%"
            iframe.height = "100%";
            iframe.allow = "fullscreen"
            video_title.innerText = title;

            div.append(iframe, video_title);
            video_container.append(div);
        });
    }

</script>
