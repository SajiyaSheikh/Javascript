// Create Employee Constructor function whose bonus is 10% of salary

function Employee(id,name,salary,department)
{
    this.id=id,
    this.name=name,
    this.salary=salary,
    this.department=department,

    this.getBonus=function()
    {
        return (10/this.salary)*100
    }
}
