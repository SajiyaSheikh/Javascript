<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure and Debouncing</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0f1014;
            color: white;
        }

        /* Header */
        h1 {
            margin: 0;
            padding: 15px 20px;
            background-color: #121926;
            color: #00A8E1;
            font-size: 24px;
        }

        /* Search box */
        #query {
            width: 25%;
            margin: 15px 20px;
            padding: 10px;
            border-radius: 6px;
            border: none;
            outline: none;
            font-size: 16px;
        }


        /* Movies container */
        #movies {
            width: 25%;
            margin: 0px 20px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 8px;
            background-color: #1a1d29;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* Each movie row */
        #movie_box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #2c2f3a;
            cursor: pointer;
            transition: background 0.3s;
        }

        #movie_box:hover {
            background-color: #2c2f3a;
        }

        /* Movie image */
        #image {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Movie title */
        #movie_box p {
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>

<body>
    <h1>Hotstar</h1>
    <input type="text" id="query" oninput="debounce(main,1000)" placeholder="Search Movies">
    <div id="movies"></div>
</body>

</html>

<script>


    let movies_div = document.querySelector("#movies");
    let id;

    // it will going to make fetch call, hence async function
    async function searchMovies() {
        try {
            //https://www.omdbapi.com/?s=avengers&apikey=9c7f0111
            const query = document.querySelector("#query").value;
            const res = await fetch(`https://www.omdbapi.com/?s=${query}&apikey=9c7f0111`);
            const data = await res.json();
            //console.log("Data:", data);
            const movies = data.Search;
            console.log(movies)
            return movies;
        }
        catch (err) {
            console.log("err:", err);
        }
    }

    function appendMovies(data) {
        movies_div.innerHTML = null;
        data.forEach(element => {

            let div = document.createElement("div");
            div.setAttribute("id", "movie_box")

            let img = document.createElement("img");
            img.src = element.Poster;
            img.setAttribute("id", "image")

            let p = document.createElement("p");
            p.innerText = element.Title;

            div.append(img, p);
            movies_div.append(div);
        });
    }

    async function main() {
        let movie_data = await searchMovies()
        if (movie_data === undefined)
            return false;

        appendMovies(movie_data);
    }

    // This
    function debounce(func, delay) {
        if (id) {
            clearTimeout(id);
        }

        id = setTimeout(() => {
            func();
        }, delay)

    }
</script>
