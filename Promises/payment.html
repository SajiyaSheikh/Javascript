<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <style>
        #container {
            margin: auto;
            margin-top: 50px;
            height: 400px;
            width: 400px;

        }
    </style>

</head>

<body>
    <div id="container">
        <img id="image" src="https://cdn.pixabay.com/animation/2025/11/11/02/19/02-19-36-889_512.gif" alt="">
    </div>

</body>

</html>

<script>

    function checkTransaction() {
        return true;
    }

    // create a promise which returns success and failure
    let image = document.querySelector("#image");
    let myPromise = new Promise((resolve, reject) => {

        let transaction_status = false;
        setTimeout(() => {

            transaction_status = checkTransaction();
            if (transaction_status === true) {
                resolve("Payment Successfull")
            }
            else {
                reject("Payment Failed")
            }
        }, 2000)

    })

    //console.log(myPromise)
    myPromise.then((res) => {
        console.log(res);
        image.src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExNDllOGRxeDR1Y2N2anU4emd1MGxid2UzenJpdWt6Z3hyZXR3ZXNpbyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/8Fr8hmVNAg0GiQ6rI4/giphy.webp"

    }).catch((err) => {
        console.log(err);
        image.src = "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHR0MDQwem4wbHJubTVsejhvZmhwbjhrdzI5M3UzZHM2M3JvNTVqbiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/vVZypcXdxD508UOjfY/giphy.webp"
    })
</script>
